<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temple account recovery</title>
<style>*{box-sizing:border-box}body{margin:1rem auto;padding:0 1rem;max-width:45rem;background:#101827;color:#fff;font:16px system-ui}section{padding:1rem;margin:.7rem 0;border:1px solid #526075;border-radius:10px;overflow-wrap:anywhere}button,input{padding:.65rem;margin:.3rem .25rem .3rem 0;font:inherit;max-width:100%}a{color:#91dfee}small{display:block}dialog{max-width:94vw}</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script></head><body>
<a href="adok.html">Papa Admin</a><h1>Account recovery</h1><p role="status" id="status"></p><button id="refresh">Refresh</button><h2>Firebase accounts</h2><div id="users"></div><h2>Device links</h2><div id="links"></div>
<dialog id="change"><form method="dialog"><label>New app password <input id="secret" type="password" minlength="6" autocomplete="new-password"></label><button value="save">Save password</button><button value="cancel" formnovalidate>Cancel</button></form></dialog>
<script>
const firebaseConfig = {
            apiKey: "AIzaSyDf3lUv3k6kWCE0rxGfMfkwy2uARiXVFaY",
            authDomain: "iskcon-master-hub.firebaseapp.com",
            databaseURL: "https://iskcon-master-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "iskcon-master-hub",
            storageBucket: "iskcon-master-hub.firebasestorage.app",
            messagingSenderId: "678769736356",
            appId: "1:678769736356:web:17e68b347e36f131b68431"
        };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const el = id => document.getElementById(id);
function status(msg){el('status').textContent=msg}
async function request(data){
    if(!auth.currentUser) throw Error('Sign in to Papa Admin on this browser, then reopen Account recovery.');
    const token=await auth.currentUser.getIdToken();
    const res=await fetch('/api/temple-accounts',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(data)});
    const output=await res.json().catch(()=>({}));
    if(!res.ok) throw Error(output.error || 'Papa Admin access required. HTTP '+res.status);
    return output;
}
function card(parent,title){
    const row=document.createElement('section');
    const name=document.createElement('strong');
    name.textContent=title;
    row.append(name,document.createElement('br'));
    el(parent).append(row);
    return row;
}
function button(row,label,fn){
    const b=document.createElement('button');
    b.textContent=label;
    b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){status(e.message)}finally{b.disabled=false}};
    row.append(b);
}
async function reload(){
    el('users').replaceChildren(); el('links').replaceChildren();
    let cursor, links=[], users=[];
    do{
        const data=await request({action:'list',cursor});
        users.push(...data.users); links=data.links; cursor=data.cursor;
    }while(cursor);
    for(const {email,uid} of users){
        const row=card('users',email);
        button(row,'Set new app password',()=>{
            const dialog=el('change'); el('secret').value=''; dialog.returnValue='';
            dialog.onclose=async()=>{
                const password=el('secret').value; el('secret').value='';
                if(dialog.returnValue!=='save') return;
                try{await request({action:'password',email,uid,password});status('Password updated for '+email)}catch(e){status(e.message)}
            };
            dialog.showModal();
        });
        button(row,'Delete Firebase user',async()=>{
            if(!confirm('Permanently delete the Firebase sign-in account '+email+'?'))return;
            await request({action:'delete',uid,email}); await reload(); status('Deleted '+email);
        });
    }
    for(const {key,hash} of links){
        const matched=users.filter(u=>u.email.replace(/[.#$[\]]/g,'_')===key);
        const row=card('links',matched.length===1?matched[0].email:'Stored account key: '+key);
        const id=document.createElement('small');id.textContent='Device reference: '+hash;row.append(id);
        button(row,'Release this phone',async()=>{
            if(!confirm('Release device '+hash+' from '+key+'?'))return;
            await request({action:'release',key,hash});await reload();status('Phone released. Sign in inside the app with the assigned account.');
        });
    }
    status(users.length+' accounts • '+links.length+' device links');
}
el('refresh').onclick=()=>reload().catch(e=>status(e.message));
auth.onAuthStateChanged(()=>reload().catch(e=>status(e.message)));
</script></body></html>
